<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>SOFIA</title>
    <style>
        body {
            background: #111;
            color: white;
            font-family: Arial;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        #status { font-size: 20px; margin-bottom: 40px; }

        #talkButton {
            width: 180px;
            height: 180px;
            border-radius: 50%;
            border: none;
            background: #222;
            color: white;
            font-size: 20px;
            cursor: pointer;
        }

        #talkButton.recording { background: #ff3b3b; transform: scale(1.1); }

        .options-container {
            margin-top: 40px;
            display: flex;
            align-items: center;
            gap: 10px;
            background: #222;
            padding: 15px 25px;
            border-radius: 25px;
            font-size: 16px;
        }

        .options-container input[type="checkbox"] {
            width: 20px;
            height: 20px;
            cursor: pointer;
        }

        #agentPanel { width: min(680px, 90vw); margin-top: 24px; padding: 18px; background: #222; border-radius: 16px; }
        #goal { width: 100%; box-sizing: border-box; padding: 12px; background: #111; color: white; border: 1px solid #555; border-radius: 8px; }
        #agentPanel button { margin-top: 10px; padding: 10px 16px; cursor: pointer; }
        #stopAgent { background: #8b2020; color: white; border: 0; border-radius: 6px; }
    </style>
</head>
<body>
    <div id="status">Hold to talk</div>
    <button id="talkButton">RECORD!</button>
    <div class="options-container">
        <input type="checkbox" id="manipulateToggle">
        <label for="manipulateToggle">Manipular el dispositivo</label>
    </div>
    <section id="agentPanel">
        <strong>Agente local Ollama</strong>
        <p>Control acotado: no ejecuta terminal, contraseñas, pagos, borrado ni ajustes del sistema.</p>
        <textarea id="goal" rows="3" placeholder="Escribe la tarea que debe realizar..."></textarea>
        <button id="runAgent">Ejecutar tarea</button>
        <button id="stopAgent" type="button">Detener</button>
        <div id="agentStatus"></div>
    </section>

<script>
const button = document.getElementById("talkButton");
const status = document.getElementById("status");
const manipulateToggle = document.getElementById("manipulateToggle");
const goal = document.getElementById("goal");
const agentStatus = document.getElementById("agentStatus");
let recorder;
let chunks = [];

document.getElementById("runAgent").addEventListener("click", async () => {
    const text = goal.value.trim();
    if (!text) return;
    agentStatus.textContent = "Ejecutando...";
    const response = await fetch("/agent/run", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({goal: text})
    });
    const data = await response.json();
    const completed = (data.objectives || []).filter(item => item.completed).length;
    const total = (data.objectives || []).length;
    agentStatus.textContent = data.error || data.message ||
        `Estado: ${data.status} (${completed}/${total} objetivos verificados)`;
});

document.getElementById("stopAgent").addEventListener("click", async () => {
    await fetch("/agent/stop", {method: "POST"});
    agentStatus.textContent = "Deteniendo...";
});

async function startRecording() {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    recorder = new MediaRecorder(stream);
    chunks = [];
    recorder.ondataavailable = event => chunks.push(event.data);
    recorder.onstop = sendAudio;
    recorder.start();
    button.classList.add("recording");
    status.textContent = "Listening...";
}

function stopRecording() {
    if (!recorder) return;
    recorder.stop();
    recorder.stream.getTracks().forEach(track => track.stop());
    button.classList.remove("recording");
    status.textContent = "SOFIA is thinking...";
}

async function sendAudio() {
    const formData = new FormData();
    formData.append("audio", new Blob(chunks, { type: "audio/webm" }), "input.webm");
    formData.append("manipulate", manipulateToggle.checked);
    const response = await fetch("/chat", { method: "POST", body: formData });

    if (!response.ok) {
        status.textContent = "Something went wrong.";
        return;
    }

    if ((response.headers.get("content-type") || "").includes("application/json")) {
        const data = await response.json();
        status.textContent = "Action Executed: " + data.message;
        return;
    }

    const audioURL = URL.createObjectURL(await response.blob());
    const audio = new Audio(audioURL);
    status.textContent = "SOFIA is speaking...";
    audio.play();
    audio.onended = () => {
        status.textContent = "Hold to talk";
        URL.revokeObjectURL(audioURL);
    };
}

button.addEventListener("mousedown", startRecording);
button.addEventListener("mouseup", stopRecording);
button.addEventListener("mouseleave", () => {
    if (recorder && button.classList.contains("recording")) stopRecording();
});
button.addEventListener("touchstart", event => {
    event.preventDefault();
    startRecording();
});
button.addEventListener("touchend", event => {
    event.preventDefault();
    stopRecording();
});
</script>
</body>
</html>
